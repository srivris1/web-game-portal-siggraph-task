<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake — NEXUS ARCADE</title>
  <meta name="description" content="Classic Snake with neon glow effects on NEXUS ARCADE.">
  <link rel="stylesheet" href="../../css/index.css">
  <link rel="stylesheet" href="../../css/game.css">
  <link rel="stylesheet" href="neon-snake.css">
</head>
<body class="game-page neon-snake-page">
  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="game-back-btn">← Back</a>
      <div class="game-title-bar">
        <div class="game-title-icon">🐍</div>
        <h1 class="game-title">NEON SNAKE</h1>
      </div>
    </div>
    <div class="game-header-right">
      <div class="game-score-display">
        <span class="game-score-label">Score</span>
        <span class="game-score-value" id="score-value">0</span>
      </div>
      <div class="game-high-score">Best: <span id="high-score-value">0</span></div>
    </div>
  </header>

  <main class="game-container">
    <div class="game-canvas-wrapper" id="game-canvas-wrapper">
      <canvas id="game-canvas"></canvas>
      <div class="game-overlay" id="overlay-start">
        <div class="game-overlay-icon">🐍</div>
        <h2 class="game-overlay-title gradient-text">NEON SNAKE</h2>
        <p class="game-overlay-subtitle">Eat. Grow. Don't hit the walls or yourself!</p>
        <div class="game-overlay-actions">
          <button class="btn btn-primary" id="btn-start">▶ PLAY</button>
        </div>
      </div>
      <div class="game-overlay hidden" id="overlay-gameover">
        <div class="game-overlay-icon">💀</div>
        <h2 class="game-overlay-title">GAME OVER</h2>
        <p class="game-overlay-subtitle">Your Score</p>
        <div class="game-overlay-score" id="final-score">0</div>
        <div class="score-submit-form">
          <input type="text" class="score-input" id="player-name" placeholder="Enter your name" maxlength="20">
          <button class="btn btn-secondary" id="btn-submit-score">Submit Score</button>
        </div>
        <div class="game-overlay-actions">
          <button class="btn btn-primary" id="btn-restart">↻ Play Again</button>
          <a href="../../index.html" class="btn btn-ghost">← Hub</a>
        </div>
      </div>
    </div>
  </main>

  <div class="game-controls-bar">
    <div class="control-hint"><span class="control-key">W</span><span class="control-key">A</span><span class="control-key">S</span><span class="control-key">D</span> or Arrows to move</div>
    <div class="control-hint">Swipe on mobile</div>
  </div>

  <div class="touch-controls">
    <div class="touch-dpad">
      <button class="touch-btn touch-btn-up" data-dir="up">▲</button>
      <button class="touch-btn touch-btn-left" data-dir="left">◄</button>
      <button class="touch-btn touch-btn-right" data-dir="right">►</button>
      <button class="touch-btn touch-btn-down" data-dir="down">▼</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="neon-snake.js"></script>
</body>
</html>
